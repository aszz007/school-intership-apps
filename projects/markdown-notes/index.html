<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><title>纸页 · Markdown学习笔记</title><link rel="icon" href="../todo/favicon.svg"><link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head><body>
<header class="app-header"><a class="brand" href="./">纸页<small>Markdown笔记</small></a><nav class="header-links" aria-label="主导航"><a href="https://school-internship-portfolio-aszz007.pages.dev/">作品集</a><a href="../">课程作品</a></nav></header>
<div id="storage-warning" class="notice" role="status" hidden></div>
<div class="notes-shell"><aside class="notes-sidebar" id="notes-sidebar"><h1>笔记列表</h1><div class="note-create-actions"><button id="new-note" class="primary" type="button">＋ 新建笔记</button><button id="import-note" class="secondary" type="button">导入 .md</button><input id="import-note-file" type="file" accept=".md,text/markdown" hidden></div><label class="sr-only" for="note-search">搜索笔记</label><input id="note-search" class="search-input" type="search" placeholder="搜索标题或正文"><p id="search-result" class="muted" role="status"></p><div id="note-list" class="note-list" aria-label="笔记列表"></div><button id="load-examples" class="quiet" type="button">添加示例笔记</button><details class="sidebar-help"><summary>Markdown 语法</summary><p># 标题、- 列表、**粗体**、代码块。原始 HTML 按文字显示。</p></details></aside>
<main class="notes-main"><div class="mobile-toolbar"><button id="toggle-list" class="secondary" type="button" aria-expanded="false" aria-controls="notes-sidebar">笔记列表</button><div role="group" aria-label="手机笔记视图"><button class="quiet active" type="button" data-view="edit" aria-pressed="true">编辑</button><button class="quiet" type="button" data-view="preview" aria-pressed="false">预览</button></div></div>
<div id="no-note" class="empty"><span class="paper-symbol" aria-hidden="true">#</span><h2>暂无笔记</h2><p>点击“新建笔记”，或导入已有的 Markdown 文件。</p><button id="empty-new-note" class="primary" type="button">新建笔记</button></div>
<section id="editor-workspace" hidden><div class="note-top"><label class="field title-field" for="note-title"><span class="sr-only">笔记标题</span><input id="note-title" maxlength="80" placeholder="笔记标题"></label><div class="note-actions"><button class="secondary" id="export-note" type="button">导出 .md</button><button class="danger" id="delete-note" type="button">删除笔记</button></div></div><p class="editor-status"><span id="save-status" role="status">保存在此浏览器</span><span id="character-count">0 字</span></p><div class="edit-grid" id="edit-grid" data-view="edit"><div class="editor-pane"><div class="pane-caption">Markdown 编辑</div><label for="note-body" class="sr-only">Markdown正文</label><textarea id="note-body" maxlength="100000" spellcheck="false" placeholder="# 今天学到的内容&#10;&#10;在此输入 Markdown 正文。"></textarea></div><div class="preview-pane"><div class="pane-caption">实时预览</div><article id="note-preview" class="markdown-body" aria-label="Markdown预览"></article></div></div></section></main></div>
<footer class="footer">笔记只保存在当前浏览器。换设备或清除浏览器数据前，请导出 .md 文件。</footer><div class="toast" id="toast" role="status" hidden><span id="toast-message"></span><button id="undo-delete" type="button" hidden>撤销删除</button><button id="dismiss-toast" type="button" aria-label="关闭提示">×</button></div></body></html>
