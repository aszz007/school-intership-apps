<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><title>晴窗 · 城市天气查询</title><link rel="icon" href="../todo/favicon.svg"><link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script></head><body><header class="app-header"><a class="brand" href="./">晴窗<small>天气查询</small></a><nav class="header-links" aria-label="主导航"><a href="https://school-internship-portfolio-aszz007.pages.dev/">作品集</a><a href="../">课程作品</a></nav></header>
<main class="weather-main"><section class="weather-intro"><div><h1>城市天气</h1></div></section>
<section class="search-panel" aria-label="城市查询"><form id="city-form" novalidate><label for="city-input">城市名称</label><input id="city-input" class="search-input" type="search" maxlength="80" autocomplete="off" placeholder="输入城市，例如 北京、上海、成都"><button id="query-button" class="primary" type="submit">查询天气</button></form><div class="popular" id="popular-cities" aria-label="热门城市"></div><div class="history-section" id="history-section" hidden><span>最近查询</span><div id="history-cities"></div></div></section>
<div id="history-warning" class="notice" role="status" hidden></div><p id="query-status" class="query-status" role="status" aria-live="polite"></p><div id="error-panel" class="notice" role="alert" hidden><span id="error-message"></span><button id="retry" class="quiet" type="button">重试</button></div><section id="candidates" class="candidates" aria-label="选择匹配的城市" hidden><h2>请选择你要查询的城市</h2><div id="candidate-list"></div></section>
<section id="weather-result" class="weather-result" aria-labelledby="city-heading" hidden><div class="current-card"><div class="current-top"><div><p class="eyebrow">当前天气</p><h2 id="city-heading"></h2><p id="city-region" class="muted"></p></div><span id="weather-symbol" class="weather-symbol" aria-hidden="true"></span></div><div class="temperature"><strong id="temperature"></strong><span id="temperature-unit">°C</span></div><p id="weather-description" class="weather-description"></p><p id="data-time" class="muted"></p><p id="query-time" class="muted"></p></div><div class="detail-card"><h2>天气详情</h2><dl><div><dt>体感温度</dt><dd id="feels-like"></dd></div><div><dt>相对湿度</dt><dd id="humidity"></dd></div><div><dt>风速</dt><dd id="wind"></dd></div><div><dt>时区</dt><dd>Asia/Shanghai</dd></div></dl></div><div class="forecast-section"><div class="forecast-heading"><h2>未来三天</h2><span class="muted">最高 / 最低气温</span></div><div id="forecast-days" class="forecast-grid"></div></div></section>
<section id="initial-hint" class="initial-hint"><h2>尚未查询</h2><p>输入城市名称或点击热门城市。</p></section><div class="source-note">天气数据由 <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> 提供，许可为 <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>。</div></main><footer class="footer">最近查询保存在当前浏览器。</footer></body></html>
